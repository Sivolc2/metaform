<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metaform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg:      #1c1917;
    --surface: #292524;
    --border:  #44403c;
    --text:    #fafaf9;
    --muted:   #78716c;
    --advisor: #d97706;
    --ok:      #16a34a;
    --warn:    #dc2626;
    --slate:   #475569;
    --hi:      #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
    font-size: 13px; line-height: 1.6;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  header {
    padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 15px; letter-spacing: 0.1em; color: var(--hi); }
  header .sub { color: var(--muted); font-size: 11px; }
  #health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--slate); margin-left: auto; }
  #health-dot.ok  { background: var(--ok); }
  #health-dot.err { background: var(--warn); }

  main {
    display: flex; flex: 1; overflow: hidden;
  }

  /* ── social map panel ── */
  #map-panel {
    width: 320px; min-width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #map-panel h2 {
    padding: 12px 16px 8px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #graph-container { flex: 1; position: relative; overflow: hidden; }
  #graph-container svg { width: 100%; height: 100%; }

  .node circle {
    cursor: pointer;
    stroke-width: 2;
    transition: r 0.15s, stroke 0.15s;
  }
  .node circle:hover { stroke: var(--hi); }
  .node.selected circle { stroke: var(--hi); stroke-width: 3; }
  .node text {
    fill: var(--text); font-size: 11px; pointer-events: none;
    text-anchor: middle; dominant-baseline: middle;
  }
  .node .role-label {
    fill: var(--muted); font-size: 9px;
  }
  .link { stroke: var(--border); stroke-width: 1.5; }

  #dyad-list { padding: 8px 0; border-top: 1px solid var(--border); }
  .dyad-item {
    padding: 6px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: background 0.1s;
  }
  .dyad-item:hover { background: rgba(255,255,255,0.04); }
  .dyad-item.selected { background: rgba(245,158,11,0.1); }
  .dyad-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dyad-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dyad-score { color: var(--muted); font-size: 10px; flex-shrink: 0; }

  /* ── chat panel ── */
  #chat-panel {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }

  #chat-header {
    padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #chat-target-label {
    font-size: 13px; font-weight: 600; color: var(--hi);
  }
  #chat-target-role { color: var(--muted); font-size: 11px; }
  #think-budget-wrap { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  #think-budget { width: 56px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 2px 6px; border-radius: 4px; font-family: inherit; font-size: 11px; }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg-bubble {
    padding: 8px 12px; border-radius: 8px; line-height: 1.5;
  }
  .msg.user .msg-bubble { background: #27272a; color: var(--text); border-radius: 8px 8px 0 8px; }
  .msg.assistant .msg-bubble { background: #1d2b1d; border: 1px solid #254025; border-radius: 8px 8px 8px 0; }
  .msg.advisor .msg-bubble { background: #2b2010; border: 1px solid #4a3010; border-radius: 8px 8px 8px 0; }
  .msg-meta { color: var(--muted); font-size: 10px; padding: 0 4px; }

  /* story + stats card */
  .result-card {
    margin-top: 6px; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden;
  }
  .result-card-header {
    padding: 5px 10px; background: rgba(255,255,255,0.04);
    font-size: 10px; color: var(--muted); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .result-card-body { padding: 8px 10px; display: none; }
  .result-card-body.open { display: block; }

  .stat-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat-val { font-size: 16px; font-weight: 600; }
  .stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .ok-val { color: var(--ok); }
  .warn-val { color: var(--warn); }
  .hi-val { color: var(--hi); }

  .events-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .events-table th { color: var(--muted); text-align: left; padding: 2px 6px; font-weight: normal; border-bottom: 1px solid var(--border); }
  .events-table td { padding: 3px 6px; vertical-align: top; }
  .events-table tr:hover td { background: rgba(255,255,255,0.03); }
  .action-tag {
    display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px;
    background: var(--slate); color: var(--text);
  }
  .action-tag.message { background: #1e3a5f; }
  .action-tag.escalate { background: #4a1010; }
  .think-text { color: var(--muted); font-style: italic; font-size: 10px; }

  /* ── input bar ── */
  #input-bar {
    padding: 12px 18px; border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #msg-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px;
    border-radius: 6px; font-family: inherit; font-size: 13px;
    resize: none; min-height: 38px; max-height: 120px;
    line-height: 1.5; outline: none;
  }
  #msg-input:focus { border-color: var(--hi); }
  #send-btn {
    padding: 8px 16px; border-radius: 6px;
    background: var(--hi); color: #1c1917;
    border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
    white-space: nowrap; flex-shrink: 0;
  }
  #send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

  .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── empty state ── */
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); text-align: center; padding: 40px;
  }
  #empty-state .big { font-size: 32px; }
  #empty-state .hint { font-size: 11px; line-height: 1.8; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>METAFORM</h1>
  <span class="sub">humanist digital twin simulator</span>
  <div id="health-dot" title="Ollama status"></div>
</header>

<main>
  <!-- ── social map ── -->
  <div id="map-panel">
    <h2>Social Map</h2>
    <div id="graph-container">
      <svg id="graph"></svg>
    </div>
    <div id="dyad-list"></div>
  </div>

  <!-- ── chat ── -->
  <div id="chat-panel">
    <div id="chat-header">
      <div>
        <div id="chat-target-label">select a node to begin</div>
        <div id="chat-target-role"></div>
      </div>
      <div id="think-budget-wrap">
        think budget
        <input id="think-budget" type="number" value="240" min="0" max="2000" />
        chars
      </div>
    </div>

    <div id="messages">
      <div id="empty-state">
        <div class="big">◎</div>
        <div class="hint">
          Click <strong style="color:var(--advisor)">advisor</strong> to surface cross-dyad tensions<br/>
          or click a <strong>dyad node</strong> to talk to that subtwin directly.
        </div>
      </div>
    </div>

    <div id="input-bar">
      <textarea id="msg-input" rows="1" placeholder="type a message…" disabled></textarea>
      <button id="send-btn" disabled>send</button>
    </div>
  </div>
</main>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let dyads = [];
let selected = null;   // null | "advisor" | slug

// ── init ─────────────────────────────────────────────────────────────────────
async function init() {
  await checkHealth();
  await loadDyads();
  buildGraph();
  buildDyadList();
}

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    const dot = document.getElementById('health-dot');
    dot.className = d.ollama ? 'ok' : 'err';
    dot.title = d.ollama ? `Ollama OK — ${d.model}` : 'Ollama unreachable';
  } catch {}
}

async function loadDyads() {
  try {
    const r = await fetch('/api/dyads');
    dyads = await r.json();
  } catch {
    dyads = [];
  }
}

// ── D3 force graph ────────────────────────────────────────────────────────────
function nodeColor(d) {
  if (d.id === 'advisor') return '#d97706';
  if (d.breach) return '#dc2626';
  if (d.fidelity != null) {
    const f = d.fidelity;
    if (f >= 0.8) return '#16a34a';
    if (f >= 0.5) return '#ca8a04';
    return '#dc2626';
  }
  return '#475569';
}

function buildGraph() {
  const container = document.getElementById('graph-container');
  const W = container.clientWidth || 300;
  const H = container.clientHeight || 280;

  const svg = d3.select('#graph').attr('viewBox', `0 0 ${W} ${H}`);
  svg.selectAll('*').remove();

  const advisorNode = { id: 'advisor', label: 'advisor', role: 'full sight, zero hands' };
  const dyadNodes = dyads.map(d => ({
    id: d.slug,
    label: d.slug.replace(/-/g, '\u2011'),  // non-breaking hyphen
    role: d.role || '',
    fidelity: d.fidelity,
    safety: d.safety,
    breach: d.breach,
  }));
  const nodes = [advisorNode, ...dyadNodes];
  const links = dyadNodes.map(d => ({ source: 'advisor', target: d.id }));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(42));

  const linkEl = svg.append('g').selectAll('line')
    .data(links).join('line').attr('class', 'link');

  const nodeEl = svg.append('g').selectAll('g')
    .data(nodes).join('g')
    .attr('class', d => `node${selected === d.id ? ' selected' : ''}`)
    .call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end',   (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on('click', (ev, d) => selectTarget(d.id));

  nodeEl.append('circle')
    .attr('r', d => d.id === 'advisor' ? 28 : 22)
    .attr('fill', d => nodeColor(d) + '33')
    .attr('stroke', d => nodeColor(d));

  nodeEl.append('text')
    .attr('y', d => d.id === 'advisor' ? -4 : -2)
    .text(d => d.id === 'advisor' ? '◎' : d.label.slice(0, 10))
    .attr('fill', d => nodeColor(d));

  nodeEl.append('text')
    .attr('class', 'role-label')
    .attr('y', 12)
    .text(d => {
      if (d.id === 'advisor') return '';
      if (d.fidelity != null) return `f=${d.fidelity.toFixed(2)}`;
      return d.role ? d.role.slice(0, 12) : '';
    });

  sim.on('tick', () => {
    linkEl
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function buildDyadList() {
  const el = document.getElementById('dyad-list');
  el.innerHTML = '';
  // advisor entry
  const adv = document.createElement('div');
  adv.className = `dyad-item${selected === 'advisor' ? ' selected' : ''}`;
  adv.dataset.id = 'advisor';
  adv.innerHTML = `
    <div class="dyad-dot" style="background:#d97706"></div>
    <div class="dyad-name" style="color:#d97706">advisor</div>
    <div class="dyad-score">◎</div>`;
  adv.onclick = () => selectTarget('advisor');
  el.appendChild(adv);

  dyads.forEach(d => {
    const color = d.breach ? '#dc2626' : d.fidelity >= 0.8 ? '#16a34a' : d.fidelity != null ? '#ca8a04' : '#475569';
    const score = d.fidelity != null ? `f=${d.fidelity.toFixed(2)}` : '—';
    const item = document.createElement('div');
    item.className = `dyad-item${selected === d.slug ? ' selected' : ''}`;
    item.dataset.id = d.slug;
    item.innerHTML = `
      <div class="dyad-dot" style="background:${color}"></div>
      <div class="dyad-name">${d.slug}</div>
      <div class="dyad-score">${score}</div>`;
    item.onclick = () => selectTarget(d.slug);
    el.appendChild(item);
  });
}

// ── selection ────────────────────────────────────────────────────────────────
function selectTarget(id) {
  selected = id;

  // update header
  const label = document.getElementById('chat-target-label');
  const role  = document.getElementById('chat-target-role');
  if (id === 'advisor') {
    label.textContent = '◎ advisor';
    label.style.color = '#d97706';
    role.textContent = 'full sight, zero hands';
  } else {
    const d = dyads.find(x => x.slug === id) || {};
    label.textContent = id;
    label.style.color = '#fafaf9';
    role.textContent = d.role || '';
  }

  // enable input
  document.getElementById('msg-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').placeholder = id === 'advisor'
    ? 'ask the advisor something…'
    : `message ${id}…`;

  // hide empty state
  const es = document.getElementById('empty-state');
  if (es) es.style.display = 'none';

  // refresh sidebar highlights
  buildGraph();
  buildDyadList();
}

// ── chat ─────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const btn   = document.getElementById('send-btn');
  const text  = input.value.trim();
  if (!text || !selected) return;

  const think = parseInt(document.getElementById('think-budget').value, 10) || 0;

  input.value = '';
  input.style.height = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner">↻</span>';

  appendMsg('user', text, null);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: selected, message: text, think_budget: think }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      appendMsg(selected === 'advisor' ? 'advisor' : 'assistant',
        `⚠ ${err.detail || 'error'}`, null);
    } else {
      const data = await resp.json();
      appendMsg(
        selected === 'advisor' ? 'advisor' : 'assistant',
        data.reply,
        data,
      );
    }
  } catch (e) {
    appendMsg('assistant', `⚠ ${e.message}`, null);
  }

  btn.disabled = false;
  btn.textContent = 'send';
  input.focus();
}

function appendMsg(role, text, data) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text || '(empty)';
  div.appendChild(bubble);

  if (data && role !== 'user') {
    if (data.story || data.stats) {
      div.appendChild(makeResultCard(data));
    }
    if (data.tensions && data.tensions.length) {
      div.appendChild(makeTensionCard(data.tensions));
    }
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (data && data.elapsed_s) meta.textContent = `${data.elapsed_s}s`;
  if (meta.textContent) div.appendChild(meta);

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function makeResultCard(data) {
  const card = document.createElement('div');
  card.className = 'result-card';

  // stats header (always visible)
  if (data.stats) {
    const s = data.stats;
    const header = document.createElement('div');
    header.className = 'result-card-header';
    header.innerHTML = `
      <span>sim stats</span>
      <span>steps=${s.steps} · observable=${s.observable} · think=${s.think_chars}c</span>
      <span>▾</span>`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'result-card-body';

    // action counts
    const counts = Object.entries(s.action_counts || {})
      .map(([k,v]) => `${k}×${v}`).join('  ');

    let statsHtml = `<div class="stat-row" style="margin-bottom:10px">`;
    statsHtml += statEl('steps', s.steps, '');
    statsHtml += statEl('think', `${s.think_chars}/${s.think_budget}`, 'chars');
    statsHtml += statEl('actions', counts || '—', '');
    statsHtml += `</div>`;

    if (data.story) {
      statsHtml += `<div style="color:var(--muted);font-size:10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.08em">story</div>`;
      statsHtml += `<div style="font-size:12px;line-height:1.6;margin-bottom:10px">${esc(data.story)}</div>`;
    }

    if (data.events && data.events.length) {
      statsHtml += `<div style="color:var(--muted);font-size:10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.08em">event log</div>`;
      statsHtml += `<table class="events-table"><thead><tr><th>t</th><th>action</th><th>payload</th><th>think</th></tr></thead><tbody>`;
      for (const e of data.events) {
        const body = (e.payload && e.payload.body) ? esc(e.payload.body.slice(0, 120)) : '—';
        const think = e.think ? `<span class="think-text">${esc(e.think.slice(0, 80))}…</span>` : '';
        statsHtml += `<tr>
          <td>${e.t}</td>
          <td><span class="action-tag ${e.action}">${e.action}</span></td>
          <td>${body}</td>
          <td>${think}</td>
        </tr>`;
      }
      statsHtml += `</tbody></table>`;
    }

    body.innerHTML = statsHtml;
    card.appendChild(body);

    header.onclick = () => body.classList.toggle('open');
    // auto-open
    body.classList.add('open');
  }

  return card;
}

function makeTensionCard(tensions) {
  const card = document.createElement('div');
  card.className = 'result-card';
  const header = document.createElement('div');
  header.className = 'result-card-header';
  header.innerHTML = `<span>cross-dyad tensions</span><span>${tensions.length}</span><span>▾</span>`;
  const body = document.createElement('div');
  body.className = 'result-card-body';
  let html = '';
  for (const t of tensions) {
    html += `<div style="margin-bottom:10px">`;
    html += `<div style="color:var(--hi);font-size:10px;margin-bottom:2px">${esc((t.between||[]).join(' ↔ '))}</div>`;
    html += `<div style="margin-bottom:4px">${esc(t.tension || '')}</div>`;
    html += `<div style="color:var(--muted);font-size:11px;font-style:italic">↳ ${esc(t.question || '')}</div>`;
    html += `</div>`;
  }
  body.innerHTML = html;
  card.appendChild(header);
  card.appendChild(body);
  header.onclick = () => body.classList.toggle('open');
  body.classList.add('open');
  return card;
}

function statEl(label, val, unit) {
  return `<div class="stat">
    <div class="stat-val">${val}${unit ? `<span style="font-size:10px;color:var(--muted)"> ${unit}</span>` : ''}</div>
    <div class="stat-lbl">${label}</div>
  </div>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── events ────────────────────────────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── boot ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
